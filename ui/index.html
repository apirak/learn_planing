<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TCAS Browser</title>
<script>
  // ตั้งธีมก่อน render ครั้งแรก กันจอกระพริบ
  try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap">
<style>
  :root {
    --canvas: #f3f3f2; --card: #f8f8f7; --tile: #ffffff; --line: #ebebe9; --ink: #1f1f1e; --muted: #6b6b67;
    --hover: #f3f3f1; --sel: #efefed; --primary: #1a1a1a; --primary-text: #ffffff;
    --signal: #d23f31; --signal-soft: #fdecea; --signal-ink: #b42318; --bar: #3a3a38; --bar-bg: #ececea;
    --shadow: 0 1px 2px rgb(0 0 0 / .04), 0 6px 20px rgb(0 0 0 / .04);
    color-scheme: light;
    --s1: 12px; --s2: 14px; --s3: 16px; --s4: 20px; --s5: 26px;
    --r-lg: 20px; --r-md: 14px; --r-sm: 10px; --gut: 20px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --canvas: #121212; --card: #191919; --tile: #212121; --line: #2c2c2c; --ink: #ececea; --muted: #a3a39f;
      --hover: #282828; --sel: #333333; --primary: #ececea; --primary-text: #141414;
      --signal: #ff7b6e; --signal-soft: #3a1f1c; --signal-ink: #ff9a8f; --bar: #d4d4d2; --bar-bg: #333333;
      --shadow: none; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --canvas: #121212; --card: #191919; --tile: #212121; --line: #2c2c2c; --ink: #ececea; --muted: #a3a39f;
    --hover: #282828; --sel: #333333; --primary: #ececea; --primary-text: #141414;
    --signal: #ff7b6e; --signal-soft: #3a1f1c; --signal-ink: #ff9a8f; --bar: #d4d4d2; --bar-bg: #333333;
    --shadow: none; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  ::selection { background: var(--sel); color: var(--ink); }
  html { scrollbar-color: var(--line) transparent; }
  body { margin: 0; background: var(--canvas); color: var(--ink); caret-color: var(--ink);
    font: 400 var(--s2)/22px "Sarabun", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  /* ไอคอน Lucide (lucide.dev) — ใช้ผ่าน sprite ท้าย body */
  .i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* ── header ── */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 16px;
    height: 60px; padding: 0 var(--gut); background: var(--tile); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; font-size: var(--s3); font-weight: 600; margin: 0; }
  .brand::before { content: "T"; display: grid; place-items: center; width: 32px; height: 32px; border-radius: var(--r-sm);
    background: var(--primary); color: var(--primary-text); font-weight: 700; }
  .brand span { font-size: var(--s1); font-weight: 400; color: var(--muted); }
  .tools { display: flex; align-items: center; gap: 12px; white-space: nowrap; }
  .theme { display: flex; gap: 2px; padding: 3px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; }
  .theme button { display: flex; align-items: center; gap: 6px; border: 0; background: none; padding: 4px 12px; border-radius: 999px; font-size: var(--s1); line-height: 18px; color: var(--muted); cursor: pointer; }
  .theme .i { width: 14px; height: 14px; }
  .theme button:hover { color: var(--ink); }
  .theme button[aria-pressed="true"] { background: var(--primary); color: var(--primary-text); }

  /* ── คอลัมน์เลือกด้านบน, คำตอบด้านล่าง ── */
  .app { padding: var(--gut); display: grid; gap: var(--gut); }
  .browser { display: grid; grid-template-columns: 1.1fr 1fr 1.1fr 1.5fr; gap: 10px; padding: 10px;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); }
  .col { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--tile);
    border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--shadow); overflow: hidden; }
  .col-head { padding: 14px 14px 10px; }
  .col h2 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
    font-size: var(--s3); font-weight: 600; line-height: 22px; margin: 0 0 10px; }
  .col h2 .n { font-size: var(--s1); font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
  .search-box { position: relative; }
  .search-box .i { position: absolute; left: 11px; top: 10px; color: var(--muted); pointer-events: none; }
  .search { width: 100%; height: 36px; padding: 0 12px 0 34px; border: 1px solid transparent; border-radius: var(--r-sm);
    background: var(--card); font-size: var(--s2); }
  .search::placeholder { color: var(--muted); }
  .search:hover { border-color: var(--line); }
  .search:focus-visible { outline: 0; border-color: var(--ink); background: var(--tile); }
  .list { position: relative; height: 158px; overflow-y: auto; overscroll-behavior: contain; padding: 0 6px 6px;
    scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .item { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; width: 100%;
    padding: 6px 8px; border: 0; border-radius: var(--r-sm); background: none; text-align: left; cursor: pointer; }
  .item:hover { background: var(--hover); }
  .item:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
  .item[aria-pressed="true"] { background: var(--sel); font-weight: 600; }
  .item .n { color: var(--muted); font-size: var(--s1); font-weight: 400; font-variant-numeric: tabular-nums; flex: none; }
  .item .name { min-width: 0; }
  .item.all { margin-bottom: 4px; }
  .nomatch { padding: 8px; color: var(--muted); font-size: var(--s1); }

  /* ── คำตอบ ── */
  .result h1 { font-size: var(--s5); line-height: 34px; font-weight: 600; letter-spacing: -.01em; margin: 4px 0 0; text-wrap: balance; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin: 6px 0 0; color: var(--muted); font-variant-numeric: tabular-nums; }
  .textbtn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--tile); padding: 2px 12px 2px 10px; border-radius: 999px;
    font-size: var(--s1); color: var(--ink); cursor: pointer; }
  .textbtn .i { width: 14px; height: 14px; }
  .textbtn:hover:not(:disabled) { background: var(--hover); }
  .textbtn:disabled { color: var(--muted); opacity: .6; cursor: default; }
  .status { display: flex; gap: 8px; margin: 12px 0 0; padding: 8px 14px; background: var(--tile); border: 1px solid var(--line); border-radius: var(--r-sm);
    font-size: var(--s1); line-height: 18px; }
  .status .i { margin-top: 1px; color: var(--muted); }
  .status:has(#status:empty) { display: none; }

  #exams { display: grid; grid-template-columns: minmax(260px, 1fr) minmax(0, 2.2fr); gap: var(--gut); margin-top: var(--gut); align-items: start; }
  .answer, .section { background: var(--tile); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 20px; }
  .label { font-size: var(--s2); line-height: 20px; font-weight: 600; margin: 0 0 12px; }
  .label .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--signal); margin-right: 8px; vertical-align: 1px; }
  .must-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .must-list li { padding: 10px 14px; border-radius: var(--r-md); background: var(--signal-soft); color: var(--signal-ink);
    font-size: var(--s3); line-height: 22px; font-weight: 600; }
  .must-list li .key { color: inherit; opacity: .85; font-weight: 400; margin-left: 6px; }
  .must-none { margin: 0; color: var(--muted); }

  .section h2 { font-size: var(--s4); line-height: 28px; font-weight: 600; margin: 0; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 8px 0 12px; padding: 0; list-style: none; font-size: var(--s1); line-height: 18px; color: var(--muted); }
  .legend li { display: flex; align-items: center; gap: 6px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 10px 10px 0; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  tbody tr:last-child td { border-bottom: 0; }
  th:last-child, td:last-child { padding-right: 0; }
  th { font-size: var(--s1); line-height: 16px; font-weight: 500; color: var(--muted); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .key { color: var(--muted); font-size: var(--s1); }
  .bar { height: 6px; background: var(--bar-bg); border-radius: 999px; margin-top: 6px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--bar); border-radius: 999px; }
  .bar.must > span { background: var(--signal); }
  .tag { display: inline-block; padding: 1px 10px; border-radius: 999px; font-size: var(--s1); line-height: 18px; white-space: nowrap; background: var(--card); border: 1px solid var(--line); }
  .tag.must { background: var(--signal-soft); border-color: transparent; color: var(--signal-ink); font-weight: 600; }
  .tag.often { background: var(--sel); border-color: transparent; font-weight: 500; }
  .tag.some { color: var(--muted); }

  .notes { margin: 16px 0 0; padding: 12px 14px; list-style: none; font-size: var(--s1); line-height: 18px; color: var(--muted);
    background: var(--card); border-radius: var(--r-md); }
  .notes li { padding-left: 14px; position: relative; }
  .notes li + li { margin-top: 6px; }
  .notes li::before { content: ""; position: absolute; left: 0; top: 7px; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .empty { margin: 0; font-size: var(--s3); line-height: 24px; color: var(--muted); }
  a { color: var(--ink); font-weight: 500; text-underline-offset: 3px; }
  a .i { width: 14px; height: 14px; margin-left: 4px; vertical-align: -2px; }
  .ext { margin: 16px 0 0; }

  @media (max-width: 1100px) {
    .browser { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    #exams { grid-template-columns: 1fr; }
  }
  @media (max-width: 640px) {
    :root { --gut: 12px; }
    .top .brand { font-size: 0; gap: 0; }
    .top .brand span { display: none; }
    .top .brand::before { font-size: var(--s3); }
    .tools { gap: 8px; }
    .theme button { padding-inline: 8px; }
    .theme button span { display: none; }
    .result h1 { font-size: var(--s4); line-height: 28px; }
    .browser { grid-template-columns: 1fr; padding: 6px; }
    .item { padding-block: 10px; }
    .list { height: 190px; }
    .answer, .section { padding: 16px; }
  }
</style>
</head>
<body>
<!-- ไอคอนจาก Lucide v0.460.0 (ISC) https://lucide.dev/icons/ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
  <symbol id="i-monitor" viewBox="0 0 24 24"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
  <symbol id="i-external-link" viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></symbol>
</svg>
<header class="top">
  <p class="brand">TCAS Browser<span id="fetched"></span></p>
  <div class="tools">
    <button class="textbtn" id="reset" disabled><svg class="i" aria-hidden="true"><use href="#i-x"/></svg>ล้างตัวเลือกทั้งหมด</button>
    <div class="theme" role="group" aria-label="ธีม">
      <button type="button" data-theme="system" aria-label="ตามระบบ"><svg class="i" aria-hidden="true"><use href="#i-monitor"/></svg><span>ตามระบบ</span></button><button type="button" data-theme="light" aria-label="สว่าง"><svg class="i" aria-hidden="true"><use href="#i-sun"/></svg><span>สว่าง</span></button><button type="button" data-theme="dark" aria-label="มืด"><svg class="i" aria-hidden="true"><use href="#i-moon"/></svg><span>มืด</span></button>
    </div>
  </div>
</header>

<div class="app">
  <div class="browser">
    <section class="col" aria-labelledby="h-uni"></section>
    <section class="col" aria-labelledby="h-group"></section>
    <section class="col" aria-labelledby="h-field"></section>
    <section class="col" aria-labelledby="h-name"></section>
  </div>

  <main class="result" aria-live="polite">
    <h1 id="headline">กำลังโหลดข้อมูล…</h1>
    <p class="meta"><span id="summary"></span></p>
    <p class="status"><svg class="i" aria-hidden="true"><use href="#i-info"/></svg><span id="status"></span></p>
    <div id="exams"></div>
  </main>
</div>

<script>
// คอลัมน์ มหาวิทยาลัย | คณะ | สาขา | หลักสูตร (ชื่อ, รวมข้ามมหาวิทยาลัย) — กรองกันได้ทุกทิศ เลือกคอลัมน์ไหนก่อนก็ได้
const KEYS = ["uni", "group", "field", "name"];
const TITLE = { uni: "มหาวิทยาลัย", group: "คณะ (กลุ่มสาขา)", field: "สาขา", name: "หลักสูตร" };
const sel = { group: null, field: null, name: null, uni: null };
const query = { group: "", field: "", name: "", uni: "" };
let D, fetchedAt;

const th = (a, b) => a.localeCompare(b, "th");
const label = {
  group: id => D.groups[id],
  field: id => D.fields[id],
  name: id => id,
  uni: id => D.universities[id] || id,
};

// คณะ ⊃ สาขา ⊃ หลักสูตร: คอลัมน์แม่ไม่ถูกกรองด้วยลูก ไม่งั้นเลือกสาขาแล้วจะเปลี่ยนไปคณะอื่นไม่ได้
const BELOW = { group: ["field", "name"], field: ["name"] };

// หลักสูตรที่ผ่านทุกตัวกรอง ยกเว้นของคอลัมน์ `except` และคอลัมน์ลูกของมัน (ไม่ใส่ = ทุกตัวกรอง)
function filtered(except) {
  const skip = [except, ...(BELOW[except] || [])];
  return D.programs.filter(p => KEYS.every(k => skip.includes(k) || sel[k] === null || p[k] === sel[k]));
}

// ตัวที่เพิ่งคลิกอยู่เสมอ ตัวเลือกเดิมคืนกลับเฉพาะที่ยังมีหลักสูตรเข้ากัน (เช็กตามลำดับ KEYS)
// คืนรายการที่ต้องเอาออก เพื่อบอกผู้ใช้
function select(key, id) {
  const old = { ...sel }, dropped = [];
  KEYS.forEach(k => sel[k] = null);
  sel[key] = id;
  for (const k of KEYS) if (k !== key && old[k] !== null) {
    sel[k] = old[k];
    if (!filtered().length) { sel[k] = null; dropped.push(`${TITLE[k]} “${label[k](old[k])}”`); }
  }
  return dropped;
}

function buildColumns() {
  document.querySelectorAll(".col").forEach((col, i) => {
    const k = KEYS[i];
    col.innerHTML = `<div class="col-head">
        <h2 id="h-${k}">${TITLE[k]}<span class="n" id="n-${k}"></span></h2>
        <div class="search-box"><svg class="i" aria-hidden="true"><use href="#i-search"/></svg><input class="search" type="search" id="q-${k}" data-key="${k}" placeholder="ค้นหา${TITLE[k].replace(/ \(.*/, "")}" aria-label="ค้นหา${TITLE[k]}" autocomplete="off" spellcheck="false"></div>
      </div>
      <div class="list" id="${k}" role="group" aria-labelledby="h-${k}"></div>`;
  });
}

function renderList(key) {
  const progs = filtered(key), count = {};
  for (const p of progs) count[p[key]] = (count[p[key]] || 0) + 1;
  const q = query[key].trim().toLowerCase();
  const all = Object.entries(count).map(([id, n]) => ({ id, n, name: label[key](id) }));
  const items = all.filter(i => !q || i.id === sel[key] || i.name.toLowerCase().includes(q) || i.id.toLowerCase().includes(q))
    .sort((a, b) => th(a.name, b.name));
  document.getElementById(`n-${key}`).textContent = q ? `${items.length} / ${all.length}` : all.length.toLocaleString();
  // roving tabindex: กด Tab เข้าคอลัมน์ได้จุดเดียว (ตัวที่เลือก) แล้วใช้ลูกศรเลื่อน
  const btn = (id, html, cls = "") => {
    const on = sel[key] === id;
    return `<button class="item ${cls}" data-key="${key}" data-id="${esc(id ?? "")}" aria-pressed="${on}" tabindex="${on ? 0 : -1}">${html}</button>`;
  };
  document.getElementById(key).innerHTML =
    btn(null, `<span class="name">ทั้งหมด</span><span class="n">${progs.length.toLocaleString()}</span>`, "all") +
    items.map(i => btn(i.id, `<span class="name">${esc(i.name)}</span><span class="n">${i.n.toLocaleString()}</span>`)).join("") +
    (q && !items.length ? `<p class="nomatch">ไม่พบ “${esc(query[key])}”</p>` : "");
}

const MUST = 95, OFTEN = 50;

function renderExams() {
  const progs = filtered();
  const unis = new Set(progs.map(p => p.uni)).size;
  const picked = KEYS.filter(k => sel[k] !== null).map(k => label[k](sel[k]));
  document.getElementById("headline").textContent = picked.length ? picked.join(" · ") : "ทุกหลักสูตร";
  document.getElementById("summary").textContent =
    `${progs.length.toLocaleString()} หลักสูตร · ${unis.toLocaleString()} มหาวิทยาลัย`;

  const stat = {};
  let none = 0;
  for (const p of progs) {
    const ex = Object.entries(p.exams);
    if (!ex.length) none++;
    for (const [s, w] of ex) {
      const st = stat[s] ||= { n: 0, ws: [] };
      st.n++;
      if (w > 0) st.ws.push(w); // 0 = ใช้แค่คะแนนขั้นต่ำ
    }
  }
  const rows = Object.entries(stat).sort((a, b) => b[1].n - a[1].n || th(a[0], b[0]))
    .map(([s, st]) => ({ s, ...st, pct: st.n / progs.length * 100 }));
  const out = document.getElementById("exams");
  const link = progs.length === 1
    ? `<p class="ext">ดูเงื่อนไขเต็มของหลักสูตรนี้ที่ <a href="https://course.mytcas.com/programs/${progs[0].id}" target="_blank" rel="noopener">course.mytcas.com<svg class="i" aria-hidden="true"><use href="#i-external-link"/></svg></a></p>` : "";
  const notes = [
    "นับวิชาที่อยู่ในสัดส่วนคะแนน หรือใช้เป็นคะแนนขั้นต่ำ ของรอบใดรอบหนึ่ง",
    "ยังไม่มีข้อมูลรอบ 4",
    none ? `${none.toLocaleString()} หลักสูตรยังไม่มีข้อมูลคะแนนสอบ — รับด้วย portfolio / เกรด หรือรอบที่ใช้คะแนนยังไม่ประกาศ (เช่น กสพท)` : "",
  ].filter(Boolean).map(t => `<li>${esc(t)}</li>`).join("");

  if (!rows.length) {
    // ไม่ต้องสอบ แต่ใช้เกณฑ์อื่น เช่น เกรดเฉลี่ย 100% — บอกน้ำหนัก (ช่วงในทุกหลักสูตรที่เลือก)
    const others = {};
    for (const p of progs) for (const [k, w] of Object.entries(p.others || {})) (others[k] ||= []).push(w);
    const used = Object.entries(others).sort((a, b) => Math.max(...b[1]) - Math.max(...a[1]))
      .map(([k, ws]) => {
        const lo = Math.min(...ws), hi = Math.max(...ws);
        return `${esc(D.subjects[k] || k)} ${lo === hi ? lo : `${lo}–${hi}`}%`;
      });
    if (used.length) {
      out.innerHTML = `<div class="answer"><p class="empty">ใช้${used.join(" · ")}</p></div>${link}`;
      return;
    }
    out.innerHTML = `<div class="answer"><p class="empty">ยังไม่มีข้อมูลคะแนนสอบของหลักสูตรที่เลือก อาจรับด้วย portfolio / เกรดอย่างเดียว หรือ mytcas ยังไม่ประกาศรอบที่ใช้คะแนน (เช่น รอบ 3 กสพท ของแพทย์)</p></div>${link}`;
    return;
  }
  const name = s => esc(D.subjects[s] || s);
  const must = rows.filter(r => r.pct >= MUST);
  const range = ws => {
    if (!ws.length) return '<span class="key">ขั้นต่ำเท่านั้น</span>';
    const lo = Math.min(...ws), hi = Math.max(...ws);
    return lo === hi ? `${lo}%` : `${lo}–${hi}%`;
  };
  const tag = pct => pct >= MUST ? '<span class="tag must">ต้องสอบ</span>'
    : pct >= OFTEN ? '<span class="tag often">ส่วนใหญ่</span>' : '<span class="tag some">บางที่</span>';

  out.innerHTML = `<section class="answer">
      <p class="label"><span class="dot" aria-hidden="true"></span>ต้องสอบ (ใช้ใน ≥${MUST}% ของ ${progs.length.toLocaleString()} หลักสูตร)</p>
      ${must.length
        ? `<ul class="must-list">${must.map(r => `<li>${name(r.s)}<span class="key">${esc(r.s)}</span></li>`).join("")}</ul>`
        : `<p class="must-none">ไม่มีวิชาที่เกือบทุกหลักสูตรใช้ — ดูตารางด้านล่าง หรือเลือกให้แคบลง</p>`}
    </section>
    <section class="section">
      <h2>วิชาที่ใช้ทั้งหมด</h2>
      <ul class="legend">
        <li><span class="tag must">ต้องสอบ</span> ≥${MUST}% ของหลักสูตร</li>
        <li><span class="tag often">ส่วนใหญ่</span> ${OFTEN}–${MUST - 1}%</li>
        <li><span class="tag some">บางที่</span> ต่ำกว่า ${OFTEN}%</li>
        <li>น้ำหนัก = สัดส่วนคะแนนวิชานั้นในการคัดเลือก</li>
      </ul>
      <table>
        <thead><tr><th>วิชา</th><th class="num">หลักสูตร</th><th>โอกาส</th><th class="num">น้ำหนัก</th></tr></thead>
        <tbody>${rows.map(r => `<tr>
          <td>${name(r.s)} <span class="key">${esc(r.s)}</span>
            <div class="bar${r.pct >= MUST ? " must" : ""}" aria-hidden="true"><span style="width:${r.pct}%"></span></div></td>
          <td class="num">${r.n.toLocaleString()} <span class="key">${r.pct.toFixed(0)}%</span></td>
          <td>${tag(r.pct)}</td>
          <td class="num">${range(r.ws)}</td>
        </tr>`).join("")}</tbody>
      </table>
      <ul class="notes">${notes}</ul>
      ${link}
    </section>`;
}

function render(focus) {
  KEYS.forEach(renderList);
  // innerHTML ใหม่ทำให้ตัวที่เลือกในคอลัมน์อื่นหลุดจอ เลื่อนกลับมาให้เห็น
  for (const k of KEYS) {
    const list = document.getElementById(k), b = list.querySelector('[aria-pressed="true"]');
    if (b && (b.offsetTop < list.scrollTop || b.offsetTop + b.offsetHeight > list.scrollTop + list.clientHeight))
      list.scrollTop = b.offsetTop - list.clientHeight / 2;
  }
  renderExams();
  document.getElementById("reset").disabled = KEYS.every(k => sel[k] === null);
  if (focus) document.querySelector(`#${focus} [aria-pressed="true"]`)?.focus();
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

const status = msg => document.getElementById("status").textContent = msg;

document.addEventListener("click", e => {
  const b = e.target.closest(".item");
  if (!b) return;
  const key = b.dataset.key;
  const dropped = select(key, b.dataset.id || null);
  status(dropped.length ? `เอา ${dropped.join(", ")} ออก เพราะไม่มีหลักสูตรที่ตรงกับตัวเลือกใหม่` : "");
  render(key);
});

// คีย์บอร์ด: ↑↓ ในคอลัมน์, ←→ ข้ามคอลัมน์, Home/End, ↓ จากช่องค้นหาลงรายการ, / ไปช่องค้นหา
document.addEventListener("keydown", e => {
  const t = e.target;
  if (e.key === "/" && !/^(INPUT|TEXTAREA)$/.test(t.tagName)) {
    e.preventDefault();
    const k = t.closest?.(".item")?.dataset.key || "uni";
    document.getElementById(`q-${k}`).focus();
    return;
  }
  if (t.classList?.contains("search")) {
    if (e.key === "ArrowDown") { e.preventDefault(); document.getElementById(t.dataset.key).querySelector(".item")?.focus(); }
    if (e.key === "Escape" && t.value) { t.value = ""; query[t.dataset.key] = ""; renderList(t.dataset.key); }
    return;
  }
  if (!t.classList?.contains("item")) return;
  const items = [...t.parentElement.querySelectorAll(".item")], i = items.indexOf(t);
  const move = el => { if (el) { e.preventDefault(); el.focus(); el.scrollIntoView({ block: "nearest" }); } };
  const ki = KEYS.indexOf(t.dataset.key);
  const col = d => document.getElementById(KEYS[ki + d]);
  switch (e.key) {
    case "ArrowDown": return move(items[i + 1]);
    case "ArrowUp": return i === 0 ? move(document.getElementById(`q-${t.dataset.key}`)) : move(items[i - 1]);
    case "Home": return move(items[0]);
    case "End": return move(items.at(-1));
    case "ArrowRight": return move(col(1)?.querySelector('[aria-pressed="true"]'));
    case "ArrowLeft": return move(col(-1)?.querySelector('[aria-pressed="true"]'));
  }
});

document.addEventListener("input", e => {
  if (!e.target.classList.contains("search")) return;
  query[e.target.dataset.key] = e.target.value;
  renderList(e.target.dataset.key);
});

document.getElementById("reset").addEventListener("click", () => {
  KEYS.forEach(k => { sel[k] = null; query[k] = ""; document.getElementById(`q-${k}`).value = ""; });
  status("");
  render();
});

// ธีม: ตามระบบ / สว่าง / มืด — จำไว้ในเครื่อง
const themeBtns = document.querySelectorAll(".theme button");
function setTheme(t, save) {
  if (t === "system") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = t;
  themeBtns.forEach(b => b.setAttribute("aria-pressed", b.dataset.theme === t));
  if (save) try { t === "system" ? localStorage.removeItem("theme") : localStorage.setItem("theme", t); } catch {}
}
themeBtns.forEach(b => b.addEventListener("click", () => setTheme(b.dataset.theme, true)));
setTheme(document.documentElement.dataset.theme || "system");

buildColumns();
fetch("../data/browse.json").then(r => r.json()).then(j => {
  D = j.data;
  fetchedAt = j.fetched_at.slice(0, 10);
  document.getElementById("fetched").textContent = `ข้อมูล mytcas ณ ${fetchedAt}`;
  render();
}).catch(err => {
  document.getElementById("headline").textContent = "โหลดข้อมูลไม่สำเร็จ";
  document.getElementById("summary").textContent = "เปิดหน้านี้ผ่าน pnpm dev (เปิดไฟล์ตรง ๆ ไม่ได้) แล้วรีเฟรช — ถ้ายังไม่ได้ ให้รัน pnpm scrape ก่อน";
  console.error(err);
});
</script>
