# Deploy เฉพาะหน้า UI + browse.json ขึ้น GitHub Pages
# ไม่ deploy ทั้ง repo: data/exam_subjects.json มีตัวอย่างข้อสอบลิขสิทธิ์ ทปอ., README เป็นแผนภายใน
name: Pages

on:
  push:
    branches: [main]
    paths: [ui/**, data/browse.json, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site
        # คงโครงสร้าง ui/ + data/ ไว้ เพราะหน้าโหลด ../data/browse.json
        run: |
          mkdir -p _site/ui _site/data
          cp ui/index.html _site/ui/
          cp data/browse.json _site/data/
          echo '<meta http-equiv="refresh" content="0; url=ui/">' > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
